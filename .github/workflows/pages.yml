name: Website

# The web builder's website (web/) on GitHub Pages, with the latest release's
# files (tools/build_site.py): published again for every release (build.yml's
# release job runs this), and when the site itself changes on main. (Pages must be set to "GitHub Actions" in
# the repository's settings: Settings > Pages > Source.)
on:
  release:
    types: [published, edited, deleted]   # (notes edited on GitHub show on the site too)
  push:
    branches: [main]
    paths: ["web/**", "tools/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: The site, with the latest release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
