name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 3DS builds, with the official devkitPro toolchain.
  build-3ds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and Git
        run: |
          command -v python3 >/dev/null && command -v git >/dev/null || {
            apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
          }

      - name: Build hello3d
        run: make -C 3ds_port/hello3d

      - name: Upload hello3d .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: hello3d
          path: 3ds_port/hello3d/hello3d.3dsx

      - name: Fetch decompilation and SDK
        run: python3 tools/bootstrap.py

      - name: Build libnitro for the 3DS
        # Compiler errors are also posted as annotations, so they show up on
        # the pull request without opening the log.
        run: |
          set -o pipefail
          make -C 3ds_port/nitro TARGET=3ds 2>&1 | tee build-3ds.log || {
            grep -E "error|Error" build-3ds.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Check every SDK function the game calls exists (3DS build)
        run: >
          python3 tools/check_sdk_coverage.py 3ds_port/nitro/build/3ds/libnitro.a
          --nm "$DEVKITARM/bin/arm-none-eabi-nm" --strict

  # Python tools and PC unit tests.
  tools-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python tools compile
        run: python -m py_compile tools/*.py builder/*.py

      - name: Fetch decompilation and SDK
        run: python tools/bootstrap.py

      - name: Survey SDK usage
        run: python tools/survey_sdk_usage.py

      - name: libnitro unit tests
        # A broken interrupt or frame hook makes the tests wait forever, so cap them.
        run: timeout 600 make -C 3ds_port/nitro

      - name: Check every SDK function the game calls exists (PC build)
        run: python tools/check_sdk_coverage.py --strict
