name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 3DS builds use the official devkitPro toolchain.
  build-3ds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and Git
        run: |
          command -v python3 >/dev/null && command -v git >/dev/null || {
            apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
          }

      # The decompilation's data tools (tools/prepare_game_dataproc.py) are
      # built for the machine running the build: a C compiler.
      - name: Install a PC C compiler (for the data tools)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev patch

      - name: Test the PICA ABI bridge across enum modes (real 3DS headers)
        run: python3 -m unittest discover -s tools -p test_pica_abi.py -v

      - name: Build portable pak reader for 3DS
        run: make -C 3ds_port/pak TARGET=3ds lib

      - name: Fetch decompilation and both SDKs (fresh; check patches)
        run: python3 tools/bootstrap.py --clean

      - name: Build libnitro for the 3DS
        shell: bash
        run: |
          set -o pipefail
          make -C 3ds_port/nitro TARGET=3ds 2>&1 | tee build-3ds-nitro.log || {
            grep -E "error|Error" build-3ds-nitro.log | head -20 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Build libnitrosystem for the 3DS
        shell: bash
        run: |
          set -o pipefail
          make -C 3ds_port/nitrosystem TARGET=3ds 2>&1 | tee build-3ds-nitrosystem.log || {
            grep -E "error|Error" build-3ds-nitrosystem.log | head -20 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Compile the original game sources for 3DS
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" -C 3ds_port/game TARGET=3ds lib 2>&1 | tee build-3ds-game.log || {
            # Compiler errors, Python tracebacks and make's own failure lines.
            grep -iE "error|traceback|\*\*\*|not found|no such file" build-3ds-game.log \
              | head -20 | sed 's/^/::error::/' || true
            tail -15 build-3ds-game.log | sed 's/^/::error title=Last lines::/' || true
            exit 1
          }

      # Built to check that it links and converts to a .3dsx, but never
      # uploaded: it contains compiled game code. Build it yourself to run
      # it with your own data pack (3ds_port/game/README.md).
      - name: Build the game program for the 3DS
        shell: bash
        run: |
          set -o pipefail
          make -C 3ds_port/game TARGET=3ds program 2>&1 | tee build-3ds-program.log || {
            grep -iE "error|undefined reference|\*\*\*" build-3ds-program.log \
              | head -20 | sed 's/^/::error::/' || true
            tail -15 build-3ds-program.log | sed 's/^/::error title=Last lines::/' || true
            exit 1
          }

      - name: Check where the overlays' data landed in the 3DS program
        run: >
          python3 tools/check_program_elf.py
          --readelf "$DEVKITARM/bin/arm-none-eabi-readelf"
          3ds_port/game/build/3ds/pokeplatinum.elf

      # The HOME Menu version: makerom, bannertool and the game's RSF make
      # a .cia of the program, with blank art (no ROM here). Never uploaded:
      # it contains compiled game code.
      - name: Make the HOME Menu .cia (blank art)
        shell: bash
        run: |
          apt-get install -y --no-install-recommends g++ make
          bash tools/build_cia_tools.sh build/cia-tools
          python3 tools/home_menu_art.py --blank build/home-menu-art
          make -C 3ds_port/game TARGET=3ds HOME_ART="$PWD/build/home-menu-art" \
              CIA_TOOLS="$PWD/build/cia-tools" cia
          ls -l 3ds_port/game/build/3ds/pokeplatinum.cia

  # The WideArt editor (tools/wideart: drawing the wide screen's bands by
  # hand) as a Windows program. It contains no game code or data: the
  # captures and pictures it works on stay on the person's SD card.
  wideart-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow and PyInstaller
        run: python -m pip install pillow==11.1.0 pyinstaller==6.11.1

      - name: The editor's tests
        run: python -m unittest discover -s tools -p "test_wideart.py" -v

      - name: Build WideArt.exe
        run: pyinstaller --noconfirm --onefile --windowed --name WideArt --paths tools/wideart tools/wideart/wideart.py

      - name: WideArt.exe starts, opens a capture and saves a picture (self-test)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/WideArt.exe -ArgumentList "--selftest" -Wait -PassThru
          # (the exe has no console: each check's result is in its log; on a failure the log
          # is also the step's error note, seen on the run's page)
          $log = if (Test-Path wideart_selftest.log) { Get-Content -Raw wideart_selftest.log } else { "(no log)" }
          Write-Output $log
          if ($p.ExitCode -ne 0) {
            $note = $log.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Output "::error title=WideArt self-test::$note"
            throw "WideArt self-test failed (exit $($p.ExitCode))"
          }

      - name: Upload WideArt.exe
        uses: actions/upload-artifact@v4
        with:
          name: WideArt-windows
          path: dist/WideArt.exe

  # Native host tests of the platform libraries and Python tooling.
  tools-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CI uploads no game builds (only the WideArt editor)
        run: python tools/check_ci_artifacts.py

      - name: Check Python tools compile
        run: python -m py_compile tools/*.py tools/wideart/*.py tools/banner3d/*.py builder/*.py

      # The 3D banner's converter (fetched at build time, never vendored), so
      # its test turns a made-up scene into CGFX. No game data is involved.
      - name: Fetch pycgfx (for the 3D banner's test)
        run: python tools/banner3d/make_banner.py --fetch-pycgfx-only

      - name: Pillow (for the WideArt editor's tests)
        run: python -m pip install pillow==11.1.0

      - name: Python tool unit tests (every tools/test_*.py)
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Builder unit tests (synthetic ROM images only)
        run: python -m unittest discover -s builder -p 'test_*.py' -v

      - name: Fetch decompilation and both SDKs (fresh; check patches)
        run: python tools/bootstrap.py --clean

      - name: libnitro host unit tests
        run: timeout 600 make -C 3ds_port/nitro

      - name: libnitrosystem host unit tests
        run: timeout 180 make -C 3ds_port/nitrosystem

      - name: Compile and smoke-test original game code on PC
        run: timeout 1800 make -j"$(nproc)" -C 3ds_port/game TARGET=host test

      - name: Build the game's PC runner
        run: timeout 900 make -C 3ds_port/game TARGET=host program

      - name: Every overlay resets its data when the game's overlay manager loads it
        run: |
          3ds_port/game/build/host/pokeplatinum-pc --check-overlays 2> overlay-check.log \
            || { cat overlay-check.log; exit 1; }
          tail -1 overlay-check.log

      - name: Start the game on the PC (made-up data pack; says how far it gets)
        run: python tools/boot_smoke.py 3ds_port/game/build/host/pokeplatinum-pc

  # Resource pointers in original Nintendo file formats are 32-bit.
  # Separate job so 64-bit host tests cannot hide a host32 regression.
  test-host32:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 32-bit compiler and C runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib gdb

      - name: Test pak reader on 32-bit PC (includes Python writer cross-check)
        run: make -C 3ds_port/pak TARGET=host32 test

      - name: Fetch decompilation and both SDKs (fresh; check patches)
        run: python tools/bootstrap.py --clean

      - name: libnitro 32-bit unit tests
        run: timeout 600 make -C 3ds_port/nitro TARGET=host32

      # (the job's log isn't always at hand: its failing checks go in the
      # job's annotations, which the checks API gives)
      - name: Report the failing libnitro 32-bit checks
        if: failure()
        run: |
          timeout 600 make -k -C 3ds_port/nitro TARGET=host32 test > nitro32.log 2>&1 || true
          grep -E "FAIL|checks|failures|failed|Segmentation|Aborted|core dumped|Error [0-9]|\*\*\*" nitro32.log | head -80 > nitro32-fails.txt || true
          cat nitro32-fails.txt
          echo "::error title=libnitro 32-bit tests::$(sed -e 's/%/%25/g' -e 's/\r//g' nitro32-fails.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')"

      - name: libnitrosystem 32-bit resource tests
        run: timeout 180 make -C 3ds_port/nitrosystem TARGET=host32

      - name: Diagnose a NitroSystem 32-bit test crash
        if: failure()
        run: |
          gdb -q -batch -ex 'set pagination off' \
            -ex 'run build/upstream/res' -ex 'thread apply all bt 18' \
            --args 3ds_port/nitrosystem/build/host32/test_nitrosystem || true

      - name: Compile and smoke-test original game code on 32-bit PC
        run: timeout 1800 make -j"$(nproc)" -C 3ds_port/game TARGET=host32 test

      - name: Build the game's 32-bit PC runner
        run: timeout 900 make -C 3ds_port/game TARGET=host32 program

      - name: Every overlay resets its data when loaded (32-bit)
        run: |
          3ds_port/game/build/host32/pokeplatinum-pc --check-overlays 2> overlay-check.log \
            || { cat overlay-check.log; exit 1; }
          tail -1 overlay-check.log

      - name: Start the game on a 32-bit PC (made-up data pack)
        run: python tools/boot_smoke.py 3ds_port/game/build/host32/pokeplatinum-pc

