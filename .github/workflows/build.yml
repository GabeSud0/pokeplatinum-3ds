name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hello3d:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hello3d
        run: make -C 3ds_port/hello3d

      - name: Upload .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: hello3d
          path: 3ds_port/hello3d/hello3d.3dsx

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python tools compile
        run: python -m py_compile tools/bootstrap.py builder/verify_rom.py

      - name: Bootstrap the pinned decompilation
        run: python tools/bootstrap.py
