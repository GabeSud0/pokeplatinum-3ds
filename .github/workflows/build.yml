name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 3DS builds use the official devkitPro toolchain.
  build-3ds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and Git
        run: |
          command -v python3 >/dev/null && command -v git >/dev/null || {
            apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
          }

      - name: Build hello3d
        run: make -C 3ds_port/hello3d

      - name: Upload hello3d .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: hello3d
          path: 3ds_port/hello3d/hello3d.3dsx

      - name: Fetch decompilation and both SDKs (fresh; check patches)
        run: python3 tools/bootstrap.py --clean

      - name: Build libnitro for the 3DS
        shell: bash
        run: |
          set -o pipefail
          make -C 3ds_port/nitro TARGET=3ds 2>&1 | tee build-3ds-nitro.log || {
            grep -E "error|Error" build-3ds-nitro.log | head -20 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Build libnitrosystem for the 3DS
        shell: bash
        run: |
          set -o pipefail
          make -C 3ds_port/nitrosystem TARGET=3ds 2>&1 | tee build-3ds-nitrosystem.log || {
            grep -E "error|Error" build-3ds-nitrosystem.log | head -20 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Check NitroSDK and NitroSystem coverage (3DS build)
        run: >
          python3 tools/check_sdk_coverage.py
          3ds_port/nitro/build/3ds/libnitro.a
          3ds_port/nitrosystem/build/3ds/libnitrosystem.a
          --nm "$DEVKITARM/bin/arm-none-eabi-nm" --strict

  # Native host tests of the platform libraries and Python tooling.
  tools-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python tools compile
        run: python -m py_compile tools/*.py builder/*.py

      - name: Fetch decompilation and both SDKs (fresh; check patches)
        run: python tools/bootstrap.py --clean

      - name: Survey SDK usage
        run: python tools/survey_sdk_usage.py

      - name: libnitro host unit tests
        run: timeout 600 make -C 3ds_port/nitro

      - name: libnitrosystem host unit tests
        run: timeout 180 make -C 3ds_port/nitrosystem

      - name: Check NitroSDK and NitroSystem coverage (PC build)
        run: python tools/check_sdk_coverage.py --strict

  # Resource pointers in original Nintendo file formats are 32-bit.
  # Separate job so 64-bit host tests cannot hide a host32 regression.
  test-host32:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 32-bit compiler and C runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib

      - name: Fetch decompilation and both SDKs (fresh; check patches)
        run: python tools/bootstrap.py --clean

      - name: libnitro 32-bit unit tests
        run: timeout 600 make -C 3ds_port/nitro TARGET=host32

      - name: libnitrosystem 32-bit resource tests
        run: timeout 180 make -C 3ds_port/nitrosystem TARGET=host32

      - name: Check NitroSDK and NitroSystem coverage (32-bit PC build)
        run: >
          python tools/check_sdk_coverage.py
          3ds_port/nitro/build/host32/libnitro.a
          3ds_port/nitrosystem/build/host32/libnitrosystem.a --strict
